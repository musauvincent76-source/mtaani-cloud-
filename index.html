<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mtaani Cloud - Deploy Anything</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial}
body{background:#0a0a0a;color:#fff;padding-bottom:90px}
.header{padding:20px;display:flex;justify-content:space-between;align-items:center}
.badge{background:#1a1a1a;border:1px solid #222;padding:8px 12px;border-radius:20px;font-size:12px}
.wallet{background:linear-gradient(135deg,#ffcc00,#ff9500);color:#000;margin:15px;padding:20px;border-radius:20px;display:flex;justify-content:space-between;align-items:center}
.wallet h2{font-size:28px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:15px}
.card{background:#151515;border:1px solid #222;border-radius:18px;padding:18px 10px;text-align:center;transition:0.2s}
.card:active{transform:scale(0.95);background:#1f1f1f}
.card i{font-size:22px;margin-bottom:8px;display:block}
.card span{font-size:11px;color:#aaa;display:block;margin-top:4px}
.card b{font-size:12px}
.blue{color:#3b82f6}.green{color:#22c55e}.gold{color:#ffcc00}.purple{color:#a855f7}.red{color:#ef4444}.cyan{color:#06b6d4}
.section{padding:0 15px;margin-top:10px}
.row{background:#151515;border:1px solid #222;border-radius:14px;padding:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav{position:fixed;bottom:15px;left:15px;right:15px;background:#151515;border:1px solid #222;border-radius:25px;display:flex;justify-content:space-around;padding:12px;backdrop-filter:blur(10px)}
.nav i{font-size:18px;color:#666}
.nav .active{color:#ffcc00}
.fab{background:#ffcc00;color:#000;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-35px;border:4px solid #0a0a0a}
</style>
</head>
<body>

<div class="header">
<div><h3>Mtaani Cloud</h3><small style="color:#666">Karibu, Boss</small></div>
<div class="badge"><i class="fa-solid fa-fire" style="color:#ff6a00"></i> 7 Day Streak</div>
</div>

<div class="wallet">
<div><small style="opacity:0.7">WALLET BALANCE</small><h2>KSh 0.00</h2><small>Level 1 • Explorer</small></div>
<div style="background:#000;color:#ffcc00;padding:10px 15px;border-radius:20px;font-weight:bold">+ Fund</div>
</div>

<div class="section"><b>QUICK LAUNCH</b></div>
<div class="grid">
<div class="card"><i class="fa-brands fa-whatsapp green"></i><b>Deploy Bot</b><span>WhatsApp</span></div>
<div class="card"><i class="fa-solid fa-robot purple"></i><b>My Bots</b><span>3 Active</span></div>
<div class="card"><i class="fa-solid fa-store blue"></i><b>Bot Market</b><span>Buy Bots</span></div>
<div class="card"><i class="fa-solid fa-server gold"></i><b>VPS</b><span>From 299</span></div>
<div class="card"><i class="fa-solid fa-globe cyan"></i><b>Websites</b><span>Hosting</span></div>
<div class="card"><i class="fa-solid fa-sim-card red"></i><b>Numbers</b><span>USA/UK</span></div>
</div>

<div class="section"><b>EXPLORE</b></div>
<div style="padding:15px">
<div class="row"><span><i class="fa-solid fa-chart-line gold"></i> Live Activity</span><i class="fa-solid fa-chevron-right" style="color:#333"></i></div>
<div class="row"><span><i class="fa-solid fa-gift blue"></i> Daily Offers • 3 New</span><span style="background:#ffcc00;color:#000;padding:2px 8px;border-radius:10px;font-size:10px">NEW</span></div>
<div class="row"><span><i class="fa-solid fa-headset green"></i> Support 24/7</span><i class="fa-solid fa-chevron-right" style="color:#333"></i></div>
</div>

<div class="nav">
<i class="fa-solid fa-house active"></i>
<i class="fa-solid fa-compass"></i>
<div class="fab"><i class="fa-solid fa-plus" style="color:#000"></i></div>
<i class="fa-solid fa-trophy"></i>
<i class="fa-solid fa-user"></i>
</div>

</body>
</html>
