<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mtaani Admin - TILL 3624692 LIVE</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}
body{background:#0a0a0a;color:#fff;padding:15px}
.header{background:#151515;border:1px solid #222;padding:15px;border-radius:15px;display:flex;justify-content:space-between;margin-bottom:15px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:15px}
.stat-box{background:#151515;border:1px solid #222;padding:15px;border-radius:15px;text-align:center}
.stat-box b{font-size:22px;display:block;color:#ffcc00}
.card{background:#151515;border:1px solid #222;border-radius:15px;padding:15px;margin-bottom:10px}
.pending{border-left:4px solid orange}
.approved{border-left:4px solid #22c55e}
.rejected{border-left:4px solid #ef4444}
.btn{padding:8px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:5px}
.btn-approve{background:#22c55e;color:#000}
.btn-reject{background:#ef4444;color:#fff}
.btn-copy{background:#222;color:#fff}
.input{width:100%;background:#0a0a0a;border:1px solid #222;padding:12px;border-radius:10px;color:#fff;margin-bottom:10px}
.login{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:#151515;border:1px solid #222;padding:30px;border-radius:20px;width:90%;max-width:350px;text-align:center}
</style>
</head>
<body>
<div id="loginPage" class="login">
<div class="login-box">
<h2><i class="fa-solid fa-lock" style="color:#ffcc00"></i> ADMIN LOGIN</h2>
<p style="color:#888;margin:10px 0">TILL 3624692 - LIVE MODE</p>
<input id="pin" class="input" type="password" placeholder="Weka PIN (3624)">
<button class="btn btn-approve" style="width:100%;padding:12px" onclick="login()">INGIA</button>
<small style="color:#22c55e;display:block;margin-top:10px">✅ Firebase LIVE Connected</small>
</div>
</div>
<div id="main" style="display:none">
<div class="header">
<div><h3>🔥 Mtaani Admin LIVE</h3><small style="color:#888">TILL 3624692 - Firebase</small></div>
<div style="text-align:right"><small id="time"></small><br><b style="color:#22c55e">● ONLINE</b></div>
</div>
<div class="stat">
<div class="stat-box"><b id="sPending">0</b><small>PENDING</small></div>
<div class="stat-box"><b id="sApproved">0</b><small>APPROVED</small></div>
<div class="stat-box"><b id="sTotal">KSh 0</b><small>TOTAL</small></div>
</div>
<input id="search" class="input" placeholder="🔍 Search Code / Amount / Phone..." oninput="render()">
<div id="list"></div>
<button onclick="clearAll()" style="background:#222;color:#888;border:1px solid #333;padding:10px;width:100%;border-radius:10px;margin-top:20px">Clear All (Firebase)</button>
</div>
<script>
const ADMIN_PIN = "3624";
function login(){
 if(document.getElementById('pin').value == ADMIN_PIN){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('main').style.display='block';
  initFirebase();
  localStorage.setItem('mtaani_admin','yes');
 } else alert('PIN Sio Sahihi!');
}
// Auto-login if already logged
if(localStorage.getItem('mtaani_admin')=='yes'){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('main').style.display='block';
  setTimeout(initFirebase,500);
}
setInterval(()=>{ const el=document.getElementById('time'); if(el) el.innerText = new Date().toLocaleString(); },1000);
const firebaseConfig = {
  apiKey: "AIzaSyBhgl5VUMu0dglRC-mNBX6OiGsrCcp2EDc",
  authDomain: "mtaani-cloud.firebaseapp.com",
  databaseURL: "https://mtaani-cloud-default-rtdb.firebaseio.com",
  projectId: "mtaani-cloud",
  storageBucket: "mtaani-cloud.firebasestorage.app",
  messagingSenderId: "250933958579",
  appId: "1:250933958579:web:d32e24df7d1b49af125dc6",
  measurementId: "G-HL621Z2CVS"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let allRequests = {};
function initFirebase(){
 db.ref('requests').orderByChild('createdAt').on('value', snap=>{
  allRequests = snap.val() || {};
  render();
 });
}
function render(){
 let entries = Object.entries(allRequests);
 let q = document.getElementById('search').value.toLowerCase();
 let all = Object.values(allRequests);
 document.getElementById('sPending').innerText = all.filter(r=> (r.status||'').toLowerCase().includes('pend')).length;
 document.getElementById('sApproved').innerText = all.filter(r=> (r.status||'').toLowerCase().includes('approv')).length;
 document.getElementById('sTotal').innerText = 'KSh ' + all.filter(r=> (r.status||'').toLowerCase().includes('approv')).reduce((a,b)=>a+parseInt(b.amount||0),0);
 if(q){ entries = entries.filter(([id,r])=> (r.code||'').toLowerCase().includes(q) || (r.amount||'').toString().includes(q) || (r.phone||'').includes(q) ); }
 entries = entries.sort((a,b)=> (b[1].createdAt||0)-(a[1].createdAt||0));
 let html = '';
 entries.forEach(([id,r])=>{
  const status = (r.status||'PENDING').toUpperCase();
  let cls = status.includes('PEND')?'pending':status.includes('APPROV')?'approved':'rejected';
  const timeStr = r.createdAt? new Date(r.createdAt).toLocaleString() : (r.time||'');
  const phoneStr = r.phone? `<small style="color:#ffcc00">${r.phone}</small><br>` : '';
  html+=`<div class="card ${cls}">
  <div style="display:flex;justify-content:space-between">
  <div><b>KSh ${r.amount}</b><br>${phoneStr}<small style="color:#aaa">ID: ${r.userId||''}</small></div><small style="color:#888">${timeStr}</small>
  </div>
  <div style="margin:8px 0;background:#0a0a0a;padding:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center">
  <b style="letter-spacing:1px">${r.code}</b><button class="btn btn-copy" onclick="navigator.clipboard.writeText('${r.code}')">Copy</button>
  </div>
  <small>Status: <b style="color:${status.includes('PEND')?'orange':status.includes('APPROV')?'#22c55e':'red'}">${status}</b></small>
  <div style="margin-top:10px">
  ${status.includes('PEND')?`<button class="btn btn-approve" onclick="approve('${id}')">✅ APPROVE</button><button class="btn btn-reject" onclick="reject('${id}')">❌ REJECT</button>`:''}
  </div>
  </div>`;
 });
 document.getElementById('list').innerHTML = html || '<p style="text-align:center;color:#555;margin-top:30px">Hakuna requests - Ngoja mteja atume, itakuja hapa LIVE</p>';
}
function approve(id){
 const r = allRequests[id];
 if(!r) return;
 if(!confirm('Approve KSh '+r.amount+' kwa '+r.phone+'?')) return;
 db.ref('requests/'+id).update({status:'APPROVED', approvedAt: Date.now()});
 const phone = r.phone;
 db.ref('balances/'+phone).once('value').then(snap=>{
   const cur = snap.val()?.balance || 0;
   return db.ref('balances/'+phone).set({balance: cur + parseInt(r.amount), updatedAt: Date.now(), phone: phone, lastCode: r.code});
 }).then(()=>{ alert('✅ APPROVED! KSh '+r.amount+' added kwa '+r.phone); });
}
function reject(id){ if(confirm('Reject?')) db.ref('requests/'+id).update({status:'REJECTED'}); }
function clearAll(){ if(confirm('Futa zote Firebase? Hakikisha ume-approve zote muhimu!')){ if(confirm('Uko sure kabisa?')) db.ref('requests').remove(); } }
</script>
</body>
</html>
